server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /studio-build.json { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # SPA 兜底（本项目使用 hash 路由，此处兼容历史路径）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        location = /api/novel/import-project {
            # Portable ZIP64 projects can contain several GiB of video.
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_pass http://backend:8000;
        }

        location = /api/remake/uploads {
            # 500 MiB video plus the multipart envelope; the backend checks the file itself.
            client_max_body_size 501m;
            proxy_request_buffering off;
            proxy_pass http://backend:8000;
        }
    }

    # 开放模型 API，直接转发流式响应
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 媒体文件（图片 / 视频 / 音频）
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # FastAPI 交互文档
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
