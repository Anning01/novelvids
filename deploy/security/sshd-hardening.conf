# Keep administrative access key-only. This file is installed with an early
# lexical prefix so these first-value-wins options cannot be weakened by a
# distribution default loaded later.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
