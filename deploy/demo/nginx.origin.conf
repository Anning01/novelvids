server {
    listen 80;
    listen [::]:80;
    server_name demo.xiazq.com;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.xiazq.com;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/demo.xiazq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.xiazq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DemoTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The origin is directly exposed through this Nginx instance, so never
        # accept a caller-supplied forwarding chain as the client identity.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
