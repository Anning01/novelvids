services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:///app/data/novelvids.db
      MEDIA_PATH: /app/media
      DEBUG: "false"
      GENERATE_SCHEMAS: "true"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
