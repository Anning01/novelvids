services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:///app/data/novelvids.db
      MEDIA_PATH: /app/media
      DEBUG: "false"
      GENERATE_SCHEMAS: "true"
      # 登录与团队功能开关：默认关闭（docker 部署即用，与无鉴权版本一致）。
      # 开启登录时默认使用本部署的账号密码。
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-password}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      QILING_API_BASE_URL: ${QILING_API_BASE_URL:-}
      QILING_SIGNUP_ENABLED: ${QILING_SIGNUP_ENABLED:-false}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_CONTACT_ADDRESS: ${LEGAL_CONTACT_ADDRESS:-}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
      LEGAL_STORAGE_DESCRIPTION: ${LEGAL_STORAGE_DESCRIPTION:-}
      LEGAL_RETENTION_DESCRIPTION: ${LEGAL_RETENTION_DESCRIPTION:-}
      LEGAL_ACCOUNT_DELETION_DESCRIPTION: ${LEGAL_ACCOUNT_DELETION_DESCRIPTION:-}
      LEGAL_AI_MARKING_DESCRIPTION: ${LEGAL_AI_MARKING_DESCRIPTION:-}
      LEGAL_THIRD_PARTIES_JSON: ${LEGAL_THIRD_PARTIES_JSON:-}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
